<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบส่งเอกสาร E-Filing</title>
<style>
  html,body{margin:0;height:100%;background:#F3F7FD;font-family:Tahoma,"Leelawadee UI",sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0}
  #sc{position:fixed;inset:0;background:rgba(5,15,45,.92);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;color:#fff}
  #sc.on{display:flex}
  #sc h3{margin:0 0 12px;font-size:19px}
  .box{position:relative;width:min(92vw,420px);aspect-ratio:1/1;background:#000;border-radius:16px;overflow:hidden}
  .box video{width:100%;height:100%;object-fit:cover;display:block}
  .fr{position:absolute;inset:16%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 999px rgba(5,15,45,.35)}
  .fr::after{content:'';position:absolute;left:6px;right:6px;top:0;height:3px;background:#FF8A00;border-radius:3px;animation:sl 1.8s ease-in-out infinite}
  @keyframes sl{0%,100%{top:6px}50%{top:calc(100% - 9px)}}
  #msg{margin:14px 0;text-align:center;max-width:420px;line-height:1.5}
  .b{border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin:4px}
  .b.w{background:#fff;color:#0B2A6F}.b.r{background:#E5383B;color:#fff}
</style>
</head>
<body>
<!-- แก้ลิงก์ src เป็น URL เว็บแอป /exec ของคุณ -->
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzyWlaW9TexY96j-JrHJqhp6RjIy9CchrslKSBB652UoAsn1mpQB6kCu07bl858Eipr/exec" allow="camera *; microphone *; fullscreen *; clipboard-write *" allowfullscreen></iframe>

<div id="sc">
  <h3>📷 สแกน QR Code กรมบังคับคดี</h3>
  <div class="box" id="box"><video id="v" playsinline muted></video><div class="fr"></div></div>
  <div id="msg">กำลังเปิดกล้อง...</div>
  <div>
    <label class="b w">📁 ถ่ายรูป / เลือกรูป QR<input type="file" accept="image/*" capture="environment" hidden onchange="fileScan(this.files[0])"></label>
    <button class="b r" onclick="closeScan(true)">ยกเลิก</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* หน้านี้เป็นหน้าระดับบนสุด จึงเปิดกล้องได้ — สแกนเสร็จส่งข้อความกลับไปที่ระบบ E-Filing */
const $=id=>document.getElementById(id);
let src=null,stream=null,on=false,t=0;
const cv=document.createElement('canvas');
addEventListener('message',e=>{
  const m=e.data;
  if(!m||m.ef!=='scan-request')return;
  if(!/(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(e.origin))return;
  src=e.source;
  try{src.postMessage({ef:'scan-ack'},'*');}catch(x){}
  openScan();
});
async function openScan(){
  $('sc').classList.add('on');$('box').style.display='';$('msg').textContent='กำลังเปิดกล้อง...';
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=$('v');v.srcObject=stream;await v.play();
    $('msg').textContent='ส่องกล้องไปที่ QR Code ของกรม ให้อยู่ในกรอบ';on=true;loop();
  }catch(e){
    $('box').style.display='none';
    $('msg').innerHTML='เปิดกล้องสดไม่ได้ ('+(e&&e.name||'error')+') — กรุณาอนุญาตกล้องของเว็บนี้ในเบราว์เซอร์ หรือกด <b>"ถ่ายรูป / เลือกรูป QR"</b> ด้านล่างแทน';
  }
}
function loop(){
  if(!on)return;
  const v=$('v');
  if(v.readyState>=2&&v.videoWidth&&window.jsQR){
    const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
    cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(v,0,0,w,h);
    const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});
    if(r&&r.data){done(r.data);return;}
  }
  t=setTimeout(loop,120);
}
function fileScan(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=e=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,1400/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d');cx.drawImage(im,0,0,w,h);
    const r=window.jsQR&&jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});
    if(r&&r.data)done(r.data);else $('msg').textContent='อ่าน QR จากรูปไม่ได้ — ลองถ่ายใหม่ให้ QR อยู่กลางภาพและชัดเจน';
  };im.src=e.target.result;};rd.readAsDataURL(f);
}
function done(text){
  if(navigator.vibrate){try{navigator.vibrate(60);}catch(e){}}
  closeScan(false);
  try{src&&src.postMessage({ef:'scan-result',text:text},'*');}catch(e){}
}
function closeScan(){
  on=false;clearTimeout(t);
  if(stream){stream.getTracks().forEach(x=>x.stop());stream=null;}
  $('sc').classList.remove('on');
}
</script>
</body>
</html>
